name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('install.ps1', 'run-windows.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                Write-Host "${file}: $($parseError.Message)"
              }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  windows-install:
    name: Windows install smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and start viewer
        shell: pwsh
        run: .\install.ps1 -SkipFrontendBuild
      - name: Verify viewer and autostart registration
        shell: pwsh
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:7333/api/sessions?limit=1" `
            -UseBasicParsing `
            -TimeoutSec 3
          if ($response.StatusCode -ne 200) {
            throw "Viewer health check failed"
          }
          $modeFile = Join-Path $env:LOCALAPPDATA "session-index-viewer\install-mode.txt"
          $mode = (Get-Content $modeFile -Raw).Trim()
          if ($mode -eq "task") {
            $task = Get-ScheduledTask -TaskName "Session Index Viewer" -ErrorAction Stop
            if (-not $task) { throw "Scheduled task was not created" }
          }
          elseif ($mode -eq "startup") {
            $startup = [Environment]::GetFolderPath("Startup")
            $link = Join-Path $startup "session-index-viewer.lnk"
            if (-not (Test-Path $link)) { throw "Startup shortcut was not created" }
          }
          else {
            throw "Unknown install mode: $mode"
          }
      - name: Uninstall viewer
        if: always()
        shell: pwsh
        run: .\uninstall.ps1

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
